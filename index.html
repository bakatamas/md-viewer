<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Viewer</title>
  <meta id="theme-color" name="theme-color" content="#22262e">
  <script>
    // Apply the saved theme before first paint; app.js validates it against the <select> options.
    (function () {
      var t = null;
      try { t = localStorage.getItem('mdv-theme'); } catch (e) { /* storage unavailable */ }
      if (!/^(dark|light)-[a-z]+$/.test(t || '')) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-slate' : 'light-snow';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link id="hljs-light" rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github-dark.min.css" disabled>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js"></script>
</head>
<body>
  <header class="bar">
    <button id="open-btn" class="btn icon" type="button" title="Open files… (Ctrl+O)" aria-label="Open files">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.38a1.5 1.5 0 0 1 1.06.44L11.5 7h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <div id="tabs" class="tabs" role="tablist" aria-label="Open files"></div>
    <button id="toc-btn" class="btn" type="button" aria-pressed="true">Contents</button>
    <button id="wide-btn" class="btn icon" type="button" aria-pressed="false" title="Full width" aria-label="Full width">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <select id="theme-select" class="btn select" aria-label="Theme" title="Theme">
      <optgroup label="Dark">
        <option value="dark-slate">Slate</option>
        <option value="dark-carbon">Carbon</option>
        <option value="dark-ocean">Ocean</option>
        <option value="dark-forest">Forest</option>
        <option value="dark-plum">Plum</option>
      </optgroup>
      <optgroup label="Light">
        <option value="light-paper">Paper</option>
        <option value="light-snow">Snow</option>
        <option value="light-mint">Mint</option>
        <option value="light-sky">Sky</option>
        <option value="light-rose">Rose</option>
      </optgroup>
    </select>
    <button id="about-btn" class="btn icon" type="button" title="About, features and shortcuts" aria-label="About Markdown Viewer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.15" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav id="toc" class="toc" aria-label="Table of contents"></nav>
    <main id="scroller" class="scroller" tabindex="-1">
      <div id="notice" class="notice" hidden>
        <span>Showing the copy saved when this tab was last open.</span>
        <button id="reconnect-btn" class="btn" type="button">Reconnect to file</button>
      </div>
      <article id="content" class="markdown">
        <div class="empty">
          <p class="empty-title">Open a Markdown file</p>
          <p>Click the folder icon or drop <code>.md</code> files anywhere on this window. Each file opens in its own tab.</p>
          <p class="hint">Open tabs come back next time. Changes on disk re-render automatically (Chrome/Edge).</p>
        </div>
      </article>
    </main>
  </div>

  <div id="drop" class="drop" hidden>Drop to open</div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" multiple hidden>

  <script src="app.js"></script>
</body>
</html>
